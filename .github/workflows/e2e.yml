name: E2E Regression Tests

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

  push:
    branches:
      - main

permissions:
  contents: read
  deployments: read

jobs:
  trigger-e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Get Vercel Deployment URL
        id: vercel
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEPLOY_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          ENVIRONMENT: ${{ github.event_name == 'pull_request' && 'Preview' || 'Production' }}
        run: |
          echo "Waiting for Vercel $ENVIRONMENT deployment..."
          echo "Commit: $DEPLOY_SHA"

          for i in {1..30}; do
            DEPLOYMENTS=$(curl --fail-with-body -L \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/deployments?sha=$DEPLOY_SHA&environment=$ENVIRONMENT&per_page=10")

            DEPLOYMENT_ID=$(echo "$DEPLOYMENTS" | jq -r '.[0].id // empty')

            if [ -n "$DEPLOYMENT_ID" ]; then
              echo "Found deployment: $DEPLOYMENT_ID"

              STATUSES=$(curl --fail-with-body -L \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/$REPO/deployments/$DEPLOYMENT_ID/statuses?per_page=10")

              STATE=$(echo "$STATUSES" | jq -r '.[0].state // empty')
              BASE_URL=$(echo "$STATUSES" | jq -r '.[0].environment_url // empty')

              echo "Deployment state: $STATE"
              echo "Deployment URL: $BASE_URL"

              if [ "$STATE" = "success" ] && [ -n "$BASE_URL" ] && [ "$BASE_URL" != "null" ]; then
                echo "Vercel deployment is ready."
                echo "BASE_URL=$BASE_URL" >> "$GITHUB_ENV"
                break
              fi
            fi

            if [ "$i" -eq 30 ]; then
              echo "Vercel deployment was not ready."
              exit 1
            fi

            echo "Deployment not ready yet. Waiting 10 seconds..."
            sleep 10
          done

      - name: Trigger Playwright E2E Repository
        env:
          E2E_REPO_TOKEN: ${{ secrets.E2E_REPO_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_NAME: ${{ github.event_name }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_REPO: ${{ github.repository }}
        run: |
          echo "Triggering Playwright tests with:"
          echo "BASE_URL=$BASE_URL"

          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $E2E_REPO_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/ranjandhal73/Playwright_Test/dispatches \
            -d @- <<EOF
          {
            "event_type": "run-e2e",
            "client_payload": {
              "pr_number": "${PR_NUMBER}",
              "event_name": "${EVENT_NAME}",
              "commit_sha": "${SHA}",
              "source_repo": "${SOURCE_REPO}",
              "base_url": "${BASE_URL}"
            }
          }
          EOF