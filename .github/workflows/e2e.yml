name: E2E Regression Tests

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

  push:
    branches:
      - main
jobs:
  trigger-e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Playwright E2E Repository
        env:
          E2E_REPO_TOKEN: ${{ secrets.E2E_REPO_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_NAME: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          SOURCE_REPO: ${{ github.repository }}
          BASE_URL: ${{ secrets.E2E_BASE_URL }}
        run: |
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $E2E_REPO_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/ranjandhal73/Playwright_Test/dispatches \
            -d @- <<EOF
          {
            "event_type": "run-e2e",
            "client_payload": {
              "pr_number": "${PR_NUMBER}",
              "event_name": "${EVENT_NAME}",
              "commit_sha": "${SHA}",
              "source_repo": "${SOURCE_REPO}"
              "base_url": "${BASE_URL}"
            }
          }
          EOF